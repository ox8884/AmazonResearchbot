services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_ops
    ports:
      - "5433:5432"
    volumes:
      - forge_ops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_ops"]
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  forge_ops_pg:
